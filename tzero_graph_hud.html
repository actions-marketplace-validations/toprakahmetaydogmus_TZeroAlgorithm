<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-ZERO JARVIS KNOWLEDGE & CAUSAL GRAPH</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 100%);
            color: #00ffcc;
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #header {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 100;
            background: rgba(10, 15, 25, 0.85);
            padding: 12px 20px;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            pointer-events: auto;
        }
        #header h1 { font-size: 16px; letter-spacing: 2px; color: #00ffcc; text-shadow: 0 0 8px #00ffcc; }
        #header p { font-size: 11px; color: #80d8ff; margin-top: 4px; }
        #controls {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 100;
            background: rgba(10, 15, 25, 0.85);
            padding: 10px 15px;
            border: 1px solid #ff00ff;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }
        input[type="text"] {
            background: #05070a;
            border: 1px solid #00ffcc;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: monospace;
            outline: none;
        }
        #stats-bar {
            position: absolute;
            bottom: 15px;
            left: 20px;
            z-index: 100;
            background: rgba(10, 15, 25, 0.85);
            padding: 8px 15px;
            border: 1px solid #00e5ff;
            font-size: 11px;
            border-radius: 4px;
        }
        #inspector {
            position: absolute;
            bottom: 15px;
            right: 20px;
            z-index: 100;
            width: 320px;
            max-height: 250px;
            overflow-y: auto;
            background: rgba(10, 15, 25, 0.9);
            border: 1px solid #ffd600;
            padding: 12px;
            font-size: 11px;
            border-radius: 6px;
            display: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="header">
        <h1>⚡ T-ZERO 4D KNOWLEDGE & CAUSAL GRAPH</h1>
        <p>Developer: Toprak Ahmet Aydoğmuş | Zero-Cost Neural Engine</p>
    </div>

    <div id="controls">
        <input type="text" id="searchInput" placeholder="Düğüm / Kod ara (örn: ESP32, #8421)..." oninput="filterGraph()">
    </div>

    <div id="stats-bar">
        Düğümler: <span id="nodeCount" style="color:#00ffcc">0</span> | 
        Bağlar: <span id="edgeCount" style="color:#ff00ff">0</span> | 
        FPS: <span id="fpsCount" style="color:#ffd600">60</span>
    </div>

    <div id="inspector">
        <h3 id="insTitle" style="color:#ffd600; margin-bottom:6px;">Detay</h3>
        <p id="insBody" style="color:#e0f7fa; line-height:1.4;"></p>
    </div>

    <canvas id="graphCanvas"></canvas>

    <script>
        const graphData = {"nodes": [{"id": "node_8421", "label": "Code #8421: (Toprak)->[test_etti]->(ESP32:HARDWARE + nRF24L01:HARDWARE | SPI:PROTOCOL | laboratuvar)", "group": "HARDWARE", "code": 8421, "timestamp": 1792516654.459487}], "links": [], "stats": {"total_nodes": 1, "total_edges": 0, "timeline_events": 1}};
        const domainColors = {"HARDWARE": "#00ffcc", "PROTOCOL": "#ff00ff", "SOFTWARE": "#00e5ff", "VULN": "#ff1744", "BIO": "#76ff03", "CRYPTO": "#ffd600", "QUANTUM": "#d500f9", "AEROSPACE": "#ff6d00", "AUTOMOTIVE": "#00b0ff", "FINANCE": "#00e676", "ROBOTICS": "#ff3d00", "GENERIC": "#80d8ff"};

        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        document.getElementById('nodeCount').innerText = graphData.nodes.length;
        document.getElementById('edgeCount').innerText = graphData.links.length;

        // Düğümleri rastgele pozisyonlara yerleştir
        const nodes = graphData.nodes.map((n, i) => {
            const angle = (i / Math.max(1, graphData.nodes.length)) * 2 * Math.PI;
            const radius = 150 + Math.random() * 200;
            return {
                ...n,
                x: width / 2 + Math.cos(angle) * radius,
                y: height / 2 + Math.sin(angle) * radius,
                vx: 0,
                vy: 0,
                radius: n.code ? 18 : 12,
                color: domainColors[n.group] || '#00ffcc'
            };
        });

        const nodeMap = new Map();
        nodes.forEach(n => nodeMap.set(n.id, n));

        const links = graphData.links.map(l => ({
            ...l,
            sourceNode: nodeMap.get(l.source),
            targetNode: nodeMap.get(l.target)
        })).filter(l => l.sourceNode && l.targetNode);

        // Basit Force-Directed Fizik Simülasyonu
        let zoom = 1.0;
        let panX = 0, panY = 0;
        let selectedNode = null;
        let isDragging = false;
        let dragNode = null;

        function simulate() {
            // İtme kuvveti
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[j].x - nodes[i].x;
                    const dy = nodes[j].y - nodes[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    if (dist < 300) {
                        const force = (300 - dist) / (dist * 15);
                        nodes[i].vx -= dx * force;
                        nodes[i].vy -= dy * force;
                        nodes[j].vx += dx * force;
                        nodes[j].vy += dy * force;
                    }
                }
            }

            // Bağ çekme kuvveti
            links.forEach(l => {
                const dx = l.targetNode.x - l.sourceNode.x;
                const dy = l.targetNode.y - l.sourceNode.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const force = (dist - 120) * 0.02;
                l.sourceNode.vx += dx * force;
                l.sourceNode.vy += dy * force;
                l.targetNode.vx -= dx * force;
                l.targetNode.vy -= dy * force;
            });

            // Merkeze çekim ve sürtünme
            nodes.forEach(n => {
                if (n === dragNode) return;
                n.vx += (width / 2 - n.x) * 0.002;
                n.vy += (height / 2 - n.y) * 0.002;
                n.vx *= 0.85;
                n.vy *= 0.85;
                n.x += n.vx;
                n.y += n.vy;
            });
        }

        let lastFrameTime = performance.now();
        let frameCount = 0;

        function render() {
            simulate();

            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(zoom, zoom);

            // Bağları çiz
            links.forEach(l => {
                ctx.beginPath();
                ctx.moveTo(l.sourceNode.x, l.sourceNode.y);
                ctx.lineTo(l.targetNode.x, l.targetNode.y);
                ctx.strokeStyle = l.relation === 'causes' ? 'rgba(255, 0, 85, 0.6)' : 'rgba(0, 229, 255, 0.4)';
                ctx.lineWidth = l.relation === 'causes' ? 2 : 1;
                ctx.stroke();

                // İlişki etiketi
                const midX = (l.sourceNode.x + l.targetNode.x) / 2;
                const midY = (l.sourceNode.y + l.targetNode.y) / 2;
                ctx.font = '9px monospace';
                ctx.fillStyle = '#80d8ff';
                ctx.fillText(l.relation, midX, midY);
            });

            // Düğümleri çiz
            nodes.forEach(n => {
                ctx.save();
                ctx.shadowColor = n.color;
                ctx.shadowBlur = 12;

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, 2 * Math.PI);
                ctx.fillStyle = n.color;
                ctx.fill();

                ctx.restore();

                // Düğüm halkası
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius + 3, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Metin etiketi
                ctx.font = '10px Consolas, monospace';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                const labelText = n.code ? `[#${n.code}] ${n.label}` : n.label;
                ctx.fillText(labelText, n.x, n.y + n.radius + 14);
            });

            ctx.restore();

            // FPS sayacı
            frameCount++;
            const now = performance.now();
            if (now - lastFrameTime >= 1000) {
                document.getElementById('fpsCount').innerText = frameCount;
                frameCount = 0;
                lastFrameTime = now;
            }

            requestAnimationFrame(render);
        }

        // Mouse Etkileşimi
        canvas.addEventListener('mousedown', e => {
            const mx = (e.clientX - panX) / zoom;
            const my = (e.clientY - panY) / zoom;
            for (let n of nodes) {
                const dx = n.x - mx;
                const dy = n.y - my;
                if (Math.sqrt(dx * dx + dy * dy) < n.radius + 5) {
                    dragNode = n;
                    selectedNode = n;
                    showInspector(n);
                    return;
                }
            }
            isDragging = true;
            dragStartX = e.clientX - panX;
            dragStartY = e.clientY - panY;
        });

        canvas.addEventListener('mousemove', e => {
            if (dragNode) {
                dragNode.x = (e.clientX - panX) / zoom;
                dragNode.y = (e.clientY - panY) / zoom;
            } else if (isDragging) {
                panX = e.clientX - dragStartX;
                panY = e.clientY - dragStartY;
            }
        });

        canvas.addEventListener('mouseup', () => {
            dragNode = null;
            isDragging = false;
        });

        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.1 : 0.9;
            zoom *= factor;
            zoom = Math.min(Math.max(0.2, zoom), 4.0);
        });

        function showInspector(node) {
            const ins = document.getElementById('inspector');
            ins.style.display = 'block';
            document.getElementById('insTitle').innerText = `${node.group}: ${node.label}`;
            document.getElementById('insBody').innerHTML = `
                <b>ID:</b> ${node.id}<br>
                <b>Latent Code:</b> ${node.code ? '#' + node.code : 'None'}<br>
                <b>Domain:</b> ${node.group}<br>
                <b>Timestamp:</b> ${new Date(node.timestamp * 1000).toLocaleTimeString()}
            `;
        }

        function filterGraph() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            nodes.forEach(n => {
                const match = n.label.toLowerCase().includes(query) || (n.code && n.code.toString().includes(query));
                n.color = match ? (domainColors[n.group] || '#00ffcc') : '#334155';
                n.radius = match ? (n.code ? 20 : 14) : 8;
            });
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
