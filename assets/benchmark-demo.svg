<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="auto" style="border-radius: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;">
  <!-- Background -->
  <rect width="850" height="360" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Terminal Header Bar -->
  <rect width="850" height="42" rx="12" fill="#161b22" />
  <rect y="30" width="850" height="12" fill="#161b22" />
  <line x1="0" y1="42" x2="850" y2="42" stroke="#30363d" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />
  
  <!-- Terminal Title -->
  <text x="425" y="26" fill="#8b949e" font-size="13" font-weight="600" text-anchor="middle">bash — tzero --savings (Reproducible Benchmark)</text>

  <!-- Terminal Content Lines -->
  <!-- Prompt 1: Raw Ingestion -->
  <g transform="translate(30, 75)">
    <text x="0" y="0" fill="#58a6ff" font-size="14" font-weight="bold">$</text>
    <text x="16" y="0" fill="#c9d1d9" font-size="14">tzero --raw-tokens --dir ./workspace</text>
    <text x="0" y="26" fill="#f85149" font-size="13">✖ Raw Imperative Ingestion:</text>
    <text x="210" y="26" fill="#f85149" font-size="13" font-weight="bold">166,996 tokens</text>
    <text x="350" y="26" fill="#8b949e" font-size="13">(Loops, boilerplate, internal function bodies)</text>
  </g>

  <!-- Prompt 2: T-Zero Pruned -->
  <g transform="translate(30, 155)">
    <text x="0" y="0" fill="#58a6ff" font-size="14" font-weight="bold">$</text>
    <text x="16" y="0" fill="#c9d1d9" font-size="14">tzero --compress --level T-2</text>
    <text x="0" y="26" fill="#3fb950" font-size="13">✔ T-Zero AST Context:</text>
    <text x="185" y="26" fill="#3fb950" font-size="13" font-weight="bold">8,465 tokens</text>
    <text x="300" y="26" fill="#8b949e" font-size="13">(Signatures, types, class hierarchies preserved)</text>
  </g>

  <!-- Comparison Card -->
  <g transform="translate(30, 225)">
    <rect width="790" height="105" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    
    <text x="24" y="32" fill="#58a6ff" font-size="13" font-weight="bold">BENCHMARK REDUCTION</text>
    <text x="24" y="62" fill="#3fb950" font-size="28" font-weight="bold">-94.9%</text>
    <text x="160" y="62" fill="#8b949e" font-size="13">Token Volume Stripped Without Semantic Loss</text>

    <!-- Progress Bar -->
    <rect x="24" y="78" width="500" height="10" rx="5" fill="#21262d" />
    <rect x="24" y="78" width="475" height="10" rx="5" fill="#3fb950" />

    <!-- Badges on right side -->
    <rect x="580" y="20" width="185" height="30" rx="6" fill="#238636" fill-opacity="0.2" stroke="#2ea043" stroke-width="1" />
    <text x="672" y="39" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">✔ Zero-Leak Local Keyring</text>

    <rect x="580" y="58" width="185" height="30" rx="6" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1" />
    <text x="672" y="77" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">⚡ 16 Native MCP Tools</text>
  </g>
</svg>
